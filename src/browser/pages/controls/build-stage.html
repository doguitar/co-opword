<div class="build-stage">
  <div class="build-board">{{grid}}</div>
  <div class="build-panel">
    {{options}}
    <p class="standard-rules" data-standard-rules {{rulesHidden}}>
      <strong>Standard rules:</strong> 15×15 or 21×21; black Squares match under a half-turn;
      every white Square is in both an Across Word and a Down Word.
    </p>
    <p class="build-error" role="alert">{{error}}</p>
    {{clues}}
    {{editEmail}}
    {{actions}}
  </div>
</div>
