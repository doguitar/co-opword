<label>Title <input name="title" value="{{title}}" required></label>
<label>Author <input name="author" value="{{author}}"></label>
<label>Kind
  <select name="kind">
    <option value="freestyle" {{freestyleSelected}}>Freestyle</option>
    <option value="standard" {{standardSelected}}>Standard</option>
  </select>
</label>
<label>Size <input name="size" type="number" min="9" max="21" value="{{size}}" required></label>
