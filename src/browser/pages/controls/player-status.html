<section class="player-status">
  <ul class="roster">{{players}}<li class="invite"><button type="button" class="plain" id="open-invite">Invite</button></li></ul>
  {{alerts}}
  <dialog id="invite-players">
    <ul class="invite-friends">{{friendInvites}}</ul>
    <form method="post" action="/session/invite">
      <input type="hidden" name="invite" value="{{invite}}">
      <label>Email <input name="email" type="email" required></label>
      <button type="submit" class="filled">Invite Player</button>
    </form>
    <p><button type="button" class="plain" id="copy-invite" data-invite-link="{{link}}">Invite Link</button></p>
    <p class="toast" id="invite-copied" role="status">Copied</p>
    <button type="button" class="plain" id="close-invite">Cancel</button>
  </dialog>
</section>
