<div class="build-edit">
  <label>Title <input name="title" value="{{title}}" required></label>
  <label>Author <input name="author" value="{{author}}"></label>
  <label>Kind
    <select name="kind">
      <option value="freestyle" {{freestyleSelected}}>Freestyle</option>
      <option value="standard" {{standardSelected}}>Standard</option>
    </select>
  </label>
  <p class="standard-rules" data-standard-rules hidden>
    <strong>Standard rules:</strong> 15×15 or 21×21; black Squares match under a half-turn;
    every white Square is in both an Across Word and a Down Word.
  </p>
  {{sizeField}}
  {{grid}}
  <div class="clues">{{clues}}</div>
  {{editEmail}}
  <p role="alert">{{error}}</p>
  {{actions}}
</div>
