<section class="crossword published-crossword">
  <h1>{{title}}</h1>
  <p>{{author}}</p>
  <p>{{words}} Words</p>
  <table class="grid">{{rows}}</table>
  <ul>{{clues}}</ul>
  <form method="post" action="/session">
    <input type="hidden" name="title" value="{{title}}">
    <input type="hidden" name="author" value="{{authorValue}}">
    <button type="submit" class="filled">Start a Session</button>
  </form>
</section>
