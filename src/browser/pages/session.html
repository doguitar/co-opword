<form id="select-square" method="post" action="/session/select">
  <input type="hidden" name="invite" value="{{invite}}">
</form>
<form id="type-letter" method="post" action="/session/letter">
  <input type="hidden" name="invite" value="{{invite}}">
  <input type="hidden" name="letter" value="">
</form>
<form id="clear-square" method="post" action="/session/clear">
  <input type="hidden" name="invite" value="{{invite}}">
  <input type="hidden" name="index" value="{{selected}}">
</form>
<div class="session">
  <h1>{{title}}</h1>
  <div class="session-column">
    <div class="puzzle-block">
      {{puzzle}}
    </div>
    {{playersSection}}
  </div>
  <div class="session-column">
    {{clues}}
  </div>
</div>
<script src="/session.js?v=8"></script>
