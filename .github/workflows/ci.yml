name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          load: true
          push: false
          tags: coopword:ci
      - name: Smoke test image
        run: |
          set -euo pipefail
          docker volume create coopword-ci-data >/dev/null
          cleanup() {
            docker rm -f coopword-ci-smoke >/dev/null 2>&1 || true
            docker volume rm coopword-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name coopword-ci-smoke \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=sqlite:/app/data/coopword.sqlite \
            -e PUBLIC_URL=https://ci.invalid \
            -e SMTP_USER=ci@example.invalid \
            -e SMTP_PASSWORD=ci-disposable \
            -v coopword-ci-data:/app/data \
            coopword:ci
          uid="$(docker exec coopword-ci-smoke id -u)"
          test "$uid" != "0"
          docker exec coopword-ci-smoke sh -c 'touch /app/data/.ci-write && rm /app/data/.ci-write'
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' coopword-ci-smoke)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs coopword-ci-smoke >&2
              exit 1
            fi
            sleep 2
          done
          test "$status" = "healthy"

  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Print image digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}"
          echo "Image digest (deployment identity): ${{ steps.build.outputs.digest }}"
      - name: Smoke test published image
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker volume create coopword-ci-data >/dev/null
          cleanup() {
            docker rm -f coopword-ci-smoke >/dev/null 2>&1 || true
            docker volume rm coopword-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name coopword-ci-smoke \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=sqlite:/app/data/coopword.sqlite \
            -e PUBLIC_URL=https://ci.invalid \
            -e SMTP_USER=ci@example.invalid \
            -e SMTP_PASSWORD=ci-disposable \
            -v coopword-ci-data:/app/data \
            "$image"
          uid="$(docker exec coopword-ci-smoke id -u)"
          test "$uid" != "0"
          docker exec coopword-ci-smoke sh -c 'touch /app/data/.ci-write && rm /app/data/.ci-write'
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' coopword-ci-smoke)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs coopword-ci-smoke >&2
              exit 1
            fi
            sleep 2
          done
          test "$status" = "healthy"
