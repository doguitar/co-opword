<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page-curl nav — CSS skewed fold strip (@property)</title>
  <style>
    /* Fold strip approx: registered fold endpoints + width drive sheet clip and a
       skewed backside ribbon with local (across-width) shading. Needs Chromium
       @property + atan(); not a physical paper sim. */
    @property --fold-top {
      syntax: "<length>";
      inherits: true;
      initial-value: 0px;
    }
    @property --fold-bot {
      syntax: "<length>";
      inherits: true;
      initial-value: 0px;
    }
    @property --curl-w {
      syntax: "<length>";
      inherits: true;
      initial-value: 0px;
    }

    :root {
      --bg: #fff;
      --ink: #111;
      --muted: #555;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --dur: 520ms;
    }

    body {
      --fold-top: 4.5rem;
      --fold-bot: calc(4.5rem - 100vh);
      --curl-w: 1.35rem;
      --curl-h: 100vh;
      transition:
        --fold-top var(--dur) var(--ease),
        --fold-bot var(--dur) var(--ease),
        --curl-w var(--dur) var(--ease);
    }
    body.is-open {
      --fold-top: 33vw;
      --fold-bot: 20vw;
      --curl-w: 5.2vw;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 Georgia, "Times New Roman", Times, serif;
      overflow: hidden;
    }

    .proto-status {
      position: fixed;
      left: 50%;
      bottom: 0.75rem;
      transform: translateX(-50%);
      z-index: 5;
      margin: 0;
      padding: 0.35rem 0.75rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ccc;
      font-size: 0.85rem;
      color: var(--muted);
      pointer-events: none;
    }

    .nav {
      position: fixed;
      inset: 0 auto 0 0;
      width: 33vw;
      min-width: 12.5rem;
      max-width: 22rem;
      padding: 4.5rem 1.25rem 1.5rem;
      z-index: 1;
      background: transparent;
      overflow: auto;
    }
    .nav h2 {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav a {
      display: block;
      padding: 0.55rem 0.25rem;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    .nav a:focus-visible {
      outline: 2px solid #111;
      outline-offset: 2px;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: var(--bg);
      /* One full-height fold line; its lower end starts offscreen to the left. */
      clip-path: polygon(
        var(--fold-top) 0%,
        100% 0%,
        100% 100%,
        var(--fold-bot) 100%
      );
      pointer-events: none;
    }
    .sheet img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      background: var(--bg);
    }

    /* Narrow skewed backside strip; gradient is local across width (crease → highlight). */
    .curl {
      position: fixed;
      top: 0;
      left: var(--fold-top);
      width: var(--curl-w);
      height: var(--curl-h);
      z-index: 3;
      pointer-events: none;
      transform-origin: top left;
      transform: skewX(atan(calc((var(--fold-bot) - var(--fold-top)) / var(--curl-h))));
      border-radius: 0 calc(var(--curl-w) * 0.85) calc(var(--curl-w) * 0.55) 0 /
        0 42% 38% 0;
      background:
        linear-gradient(
          90deg,
          #5a5a5a 0%,
          #8e8e8e 5%,
          #d8d8d8 12%,
          #fff 34%,
          #fafafa 48%,
          #ebebeb 68%,
          #cfcfcf 100%
        );
    }
    /* Soft cast onto revealed page/menu — outside the face, not clipped with it */
    .curl::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      right: 100%;
      width: calc(var(--curl-w) * 1.35);
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.28));
      filter: blur(5px);
      pointer-events: none;
    }

    .reveal-shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      clip-path: polygon(
        0% 0%,
        var(--fold-top) 0%,
        var(--fold-bot) var(--curl-h),
        0% var(--curl-h)
      );
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.07), transparent 60%);
    }

    .menu-toggle {
      position: fixed;
      top: 0.55rem;
      left: 0.55rem;
      z-index: 4;
      margin: 0;
      padding: 0.35rem 0.65rem;
      border: 1px solid #222;
      border-radius: 0;
      background: #fff;
      color: #111;
      font: 600 0.9rem/1 Georgia, "Times New Roman", Times, serif;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .menu-toggle:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      body.is-open {
        --fold-top: 70vw;
        --fold-bot: 52vw;
        --curl-w: 7vw;
      }
      .nav {
        width: 70vw;
        min-width: 11rem;
        max-width: 18rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --dur: 1ms; }
      body { transition: none; }
    }
  </style>
</head>

  <div class="curl" aria-hidden="true"></div>

  <button
    type="button"
    class="menu-toggle"
    id="menu-toggle"
    aria-expanded="false"
    aria-controls="menu"
  >Menu</button>

  <script>
    (function () {
      var body = document.body;
      var toggle = document.getElementById("menu-toggle");
      var menu = document.getElementById("menu");
      var status = document.getElementById("status");
      var open = false;
      var lastFocus = null;

      function setOpen(next) {
        open = next;
        body.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.textContent = open ? "Close" : "Menu";
        if (open) {
          menu.inert = false;
          status.textContent = "Prototype status: menu open";
        } else {
          menu.inert = true;
          status.textContent = "Prototype status: menu closed";
        }
      }

      toggle.addEventListener("click", function () {
        if (!open) {
          lastFocus = document.activeElement;
          setOpen(true);
          var link = menu.querySelector("a");
          if (link) link.focus();
        } else {
          setOpen(false);
          toggle.focus();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && open) {
          setOpen(false);
          (lastFocus || toggle).focus();
        }
      });

      menu.addEventListener("click", function (e) {
        var a = e.target.closest("a");
        if (!a) return;
        e.preventDefault();
        setOpen(false);
        status.textContent = "Prototype status: chose “" + (a.textContent || "").trim() + "” (" + a.getAttribute("href") + ")";
        toggle.focus();
      });
    })();
  </script>
